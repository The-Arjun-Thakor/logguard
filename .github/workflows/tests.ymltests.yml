name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: End-to-end run on generated sample logs
        run: |
          python scripts/generate_sample_logs.py sample_logs
          python -m logguard --auth sample_logs/auth.log --web sample_logs/access.log --year 2026 --out reports --fail-on critical || test $? -eq 2
